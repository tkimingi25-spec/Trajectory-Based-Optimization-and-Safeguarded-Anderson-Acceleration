name: anderson_saddles
model: BaldiHornikSaddle2
n_seeds: 30
seed_start: 3000
steps: 100
dataset: synthetic_baldi_hornik
device: cpu
optimizer:
  lr: 0.05
  momentum: 0.7
  weight_decay: 0.0
anderson:
  window: 5
  aa_interval: 10
  reg: 1.0e-06
  safeguard: true
  safeguard_max_abs: 10000.0
output_path: results/anderson_saddles_results.json
