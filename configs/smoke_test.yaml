name: smoke_test
model: TinyMLP
n_seeds: 2
seed_start: 9000
steps: 5
dataset: synthetic_regression
device: cpu
optimizer:
  lr: 0.05
  momentum: 0.7
  weight_decay: 0.0
anderson:
  window: 3
  aa_interval: 2
  reg: 1.0e-06
  safeguard: true
  safeguard_max_abs: 10000.0
output_path: results/smoke_test_results.json
